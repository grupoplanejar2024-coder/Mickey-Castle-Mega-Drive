<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Castle of Illusion Starring Mickey Mouse — Mega Drive</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d0d12;
      color: #f5f5f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: linear-gradient(90deg, #171722 0%, #241628 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 12px;
    }

    .game-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .platform-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background-color: rgba(255, 71, 87, 0.18);
      color: #ff6b81;
      border: 1px solid rgba(255, 71, 87, 0.35);
      flex-shrink: 0;
    }

    .emulator-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
    }

    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="topbar">
      <div class="game-title">Castle of Illusion Starring Mickey Mouse</div>
      <span class="platform-badge">Sega Mega Drive</span>
    </header>

    <main class="emulator-wrapper">
      <div id="game"></div>
    </main>
  </div>

  <script>
    // Substitua pelo caminho ou URL da sua ROM (.md ou .bin)
    const ROM_URL = "roms/Castle of Illusion Starring Mickey Mouse (USA, Europe).md";

    window.EJS_player = "#game";
    window.EJS_core = "segaMD";
    window.EJS_gameName = "Castle of Illusion Starring Mickey Mouse";
    window.EJS_gameUrl = ROM_URL;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = true;
    window.EJS_threads = false;

    // Configuração de controlos virtuais para ecrã tátil (Mega Drive: D-Pad + A, B, C, Start)
    window.EJS_VirtualGamepadSettings = {
      enabled: true
    };
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
